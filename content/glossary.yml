# Всплывающие подсказки. Ключ используется в тексте пакетов: [[ключ|видимый текст]]
mw:
  title: "МВт и ГВт"
  text: "Мегаватт и гигаватт — единицы мощности. 1 ГВт = 1 000 МВт — примерно столько выдаёт крупный энергоблок АЭС."
epoch:
  title: "Epoch AI"
  text: "Независимая исследовательская организация, которая собирает данные о вычислениях, моделях и дата-центрах."
token:
  title: "Токен"
  text: "Единица, в которой модель читает и пишет текст: слово или его часть. Цены для разработчиков (API) указывают за миллион токенов."
flagship:
  title: "Флагман"
  text: "Самая сильная модель компании на момент выхода."
blended:
  title: "Смешанная цена"
  text: "Средняя цена миллиона токенов, если на каждые три токена запроса приходится один токен ответа. Так две цены — за запрос и за ответ — сводят в одну, чтобы модели можно было сравнивать."
openrouter:
  title: "OpenRouter"
  text: "Сервис-посредник, через который разработчики обращаются к моделям разных компаний. По его данным видно, какими моделями пользуются и как."
reasoning:
  title: "Рассуждающие модели"
  text: "Модели, которые перед ответом расписывают ход решения. Эти промежуточные шаги оплачиваются как токены ответа."
gpqa:
  title: "GPQA Diamond"
  text: "Тест из сложных вопросов по биологии, физике и химии уровня аспирантуры. По нему сравнивают модели."
limit5:
  title: "Пятичасовой лимит"
  text: "Сколько работы подписчик может сделать за пять часов. Когда лимит исчерпан, приходится ждать, пока он обновится."
agent:
  title: "Агент"
  text: "Модель, которая сама выполняет многошаговую задачу — например, пишет код, запускает его и исправляет ошибки — без участия человека на каждом шаге."
claudecode:
  title: "Claude Code"
  text: "Инструмент Anthropic, в котором модель Claude сама пишет и правит программный код."
tokenizer:
  title: "Токенизатор"
  text: "Часть модели, которая режет текст на токены. Другой токенизатор может разрезать тот же текст на большее число токенов — и счёт вырастет."
margin:
  title: "Валовая маржа"
  text: "Доля выручки, которая остаётся после прямых затрат на саму услугу — у разработчиков моделей это в основном вычисления."
rebound:
  title: "Эффект отдачи"
  text: "Удешевление или экономия ресурса может вести к росту его общего потребления. Классический пример — уголь и паровые машины в XIX веке (парадокс Джевонса)."
h100e:
  title: "H100e"
  text: "Условная единица вычислительной мощности: столько ускорителей Nvidia H100 дали бы ту же производительность, что и посчитанные чипы. «e» — от англ. equivalent, эквивалент."
eflops:
  title: "EFLOPS"
  text: "Миллиард миллиардов (10¹⁸) операций с дробными числами в секунду — мера скорости вычислений. Один ускоритель H100 выдаёт около 0,001 EFLOPS."
sparsity:
  title: "Разреженность"
  text: "Приём, при котором ускоритель пропускает нулевые значения и формально считает вдвое быстрее. Производители часто указывают производительность именно «с разреженностью», и без оговорки непонятно, какая из двух цифр перед вами."
itpower:
  title: "IT-мощность"
  text: "Мощность, которую потребляют сами серверы и ускорители. Полная мощность дата-центра больше: к ней добавляются охлаждение и потери на преобразование энергии."
exportcontrol:
  title: "Экспортный контроль"
  text: "Ограничения США на поставки в Китай и ряд других стран передовых чипов и оборудования для их производства. Действуют с 2022 года и с тех пор не раз менялись."
warrant:
  title: "Варрант"
  text: "Право купить акции компании по заранее оговорённой цене. Здесь — почти даром, по одному центу за акцию, если получатель выполнит условия сделки."
opincome:
  title: "Операционная прибыль"
  text: "Выручка минус расходы на основную деятельность — вычисления, зарплаты, исследования. Не учитывает налоги, проценты и переоценку вложений. Если расходы больше выручки, получается операционный убыток."
pe:
  title: "P/E"
  text: "Отношение рыночной стоимости компании к её годовой чистой прибыли: за сколько лет нынешней прибыли окупится покупка компании. В среднем по американскому рынку — около 20."
runrate:
  title: "Годовой темп выручки"
  text: "Выручка последнего месяца или квартала в пересчёте на год. Быстро растущие компании называют его чаще, чем выручку за прошедший год: при быстром росте он заметно больше."
burn:
  title: "Сжигать деньги"
  text: "Тратить больше, чем зарабатываешь, и покрывать разницу деньгами инвесторов и кредиторов."
adjusted:
  title: "Скорректированная прибыль"
  text: "Прибыль, из которой компания по своей методике исключила часть расходов — например, оплату труда сотрудников акциями. Обычно она выше прибыли по стандартам бухучёта."
deepfake:
  title: "Дипфейк"
  text: "Поддельные фото, видео или записи голоса, созданные ИИ и выдаваемые за подлинные. На них строятся многие мошеннические схемы: например, звонок «от начальника», голос которого подделал ИИ."
eval:
  title: "Испытание модели"
  text: "Проверка модели во время разработки или перед выпуском: ей дают задания и смотрят, что она умеет и не ведёт ли себя опасно. Обычно проходит в тестовой среде."
sandbox:
  title: "Тестовая среда"
  text: "Отгороженная от внешнего мира компьютерная система, в которой модель обучают или проверяют. Предполагается, что из неё нельзя выйти в интернет и к настоящим серверам и сайтам — или можно, но только в заранее заданных пределах."
notable:
  title: "Заметные модели"
  text: "Модели, которые исследовательская группа Epoch AI включает в свою базу как значимые: они улучшили лучший результат в какой-либо задаче, широко цитируются, важны для истории отрасли или ими массово пользуются."
superintelligence:
  title: "Сверхинтеллект"
  text: "ИИ, который превосходит людей почти во всех интеллектуальных задачах. Пока таких систем нет."
posttrain:
  title: "Дообучение"
  text: "Продолжение обучения уже готовой модели, чтобы улучшить её навыки или поведение."
capthreshold:
  title: "Порог опасных способностей"
  text: "Уровень возможностей модели, начиная с которого лаборатория по собственным правилам обязуется усилить защиту, а иногда и остановить работу. У OpenAI высший из таких уровней называется Critical."
superforecaster:
  title: "Суперпрогнозисты"
  text: "Люди, которые в многолетних турнирах прогнозов стабильно оказываются среди самых точных. Их точность проверена на вопросах, ответ на которые становится известен через месяцы или годы; на вопросах о далёком будущем её проверить нельзя."
inference:
  title: "Инференс"
  text: "Работа уже обученной модели: ответы на запросы людей и программ. Каждый запрос требует вычислений, поэтому чем больше пользователей и чем длиннее ответы, тем больше нужно мощностей."
flop:
  title: "Операции с плавающей точкой (FLOP)"
  text: "Арифметические действия над дробными числами. Объём вычислений на обучение модели измеряют их общим числом: у крупнейших моделей 2025–2026 годов, для которых есть оценки, оно порядка 10²⁶–10²⁷, то есть единица с 26–27 нулями."
gpu:
  title: "Графический процессор (GPU)"
  text: "Чип, изначально созданный для компьютерной графики. Он выполняет множество простых вычислений параллельно, поэтому стал главным типом чипов для обучения и работы моделей ИИ."
median:
  title: "Медиана"
  text: "Значение посередине ряда: половина интервалов короче, половина длиннее. В отличие от среднего, медиану не сдвигают одна-две очень долгие паузы."
frontier:
  title: "Передовые модели"
  text: "Модели, которые на момент выхода входили в пятёрку самых больших по вычислениям на обучение, — по отбору Epoch AI. В отличие от флагмана, это понятие не привязано к одной лаборатории."
capmarket:
  title: "Аукцион мощности"
  text: "Энергосистема заранее платит электростанциям за готовность выдать электричество в часы пиковой нагрузки — даже если оно не понадобится. Это плата за запас, саму электроэнергию оплачивают отдельно. Все мегаватты на аукционе покупаются по одной цене, и эти затраты входят в счета всех потребителей."
collar:
  title: "Ценовой коридор"
  text: "Временные пол и потолок цены на аукционах мощности PJM, согласованные с губернатором Пенсильвании и одобренные федеральным регулятором FERC; действуют на аукционах 2026/27–2029/30. Потолок — около $325–333 за мегаватт в сутки, пол — около $175–180."
imm:
  title: "Монитор рынка"
  text: "Независимая организация Monitoring Analytics, которая по поручению федерального регулятора FERC следит за рынками PJM: проверяет, как складываются цены, и публикует разборы аукционов."
peak:
  title: "Пиковая нагрузка"
  text: "Часы, когда потребление электричества во всей энергосистеме за год выше всего — обычно в самую жару или сильный мороз. Под них энергосистема и держит запас мощности."
dram:
  title: "DRAM"
  text: "Оперативная память компьютеров, смартфонов, консолей и серверов: в ней хранится то, с чем устройство работает прямо сейчас. Когда питание выключают, данные в ней стираются."
hbm:
  title: "HBM"
  text: "Память с высокой пропускной способностью (High Bandwidth Memory). Несколько кристаллов DRAM ставят друг на друга и размещают вплотную к чипу ускорителя ИИ, чтобы данные шли быстрее. На каждый бит такой памяти уходит больше кремния, чем на бит обычной."
wafer:
  title: "Кремниевая пластина"
  text: "Диск из кремния диаметром 30 см, на котором одновременно изготавливают сотни чипов. Мощность фабрик памяти измеряют числом пластин в месяц."
contract:
  title: "Контрактная цена"
  text: "Цена, по которой крупные покупатели — производители ПК, смартфонов, серверов — закупают память у Samsung, SK hynix и Micron по договорам. Сами цены не раскрываются: их оценивают аналитические компании, например TrendForce, по опросам участников рынка."
ddr5:
  title: "DDR5"
  text: "Нынешнее поколение обычной оперативной памяти для ПК и серверов. Для ПК её продают модулями — «планками»; типичный комплект — две планки по 16 ГБ."
cloudserver:
  title: "Облачный сервер"
  text: "Часть мощного сервера в дата-центре хостинг-компании, которая работает как отдельный компьютер. Её арендуют помесячно или почасово; на таких серверах работают сайты, интернет-магазины и базы данных."
dedicated:
  title: "Выделенный сервер"
  text: "Физический сервер, который хостинг-компания целиком сдаёт в аренду одному клиенту."
opmargin:
  title: "Операционная маржа"
  text: "Доля выручки, которая остаётся после расходов на основную деятельность: производство, зарплаты, исследования. Налоги и проценты по долгам из неё ещё не вычтены. Маржа 76% значит, что с каждого доллара выручки после этих расходов остаётся 76 центов."
h100:
  title: "H100 и H200"
  text: "Ускорители ИИ компании Nvidia. H100 выпускают с 2022 года, H200 — его версия с увеличенной памятью HBM. Облачные компании сдают их в аренду почасово."
